# Builds the site (including a static page for every artwork, the sitemap and
# robots.txt, read from Firestore at build time) and publishes it to GitHub
# Pages (the gh-pages branch).
#
# Started by hand (and nightly once the schedule below is switched on, after
# the move to the own domain): GitHub → Actions → "Siteyi derle ve
# yayınla" → Run workflow.
#
# Needs these repository secrets (Settings → Secrets and variables → Actions),
# the same values as in the local .env file:
#   VITE_FIREBASE_API_KEY, VITE_FIREBASE_AUTH_DOMAIN, VITE_FIREBASE_PROJECT_ID,
#   VITE_FIREBASE_STORAGE_BUCKET, VITE_FIREBASE_MESSAGING_SENDER_ID,
#   VITE_FIREBASE_APP_ID, VITE_EMAILJS_SERVICE_ID, VITE_EMAILJS_PUBLIC_KEY,
#   VITE_EMAILJS_TEMPLATE_ID, VITE_IMGBB_API_KEY
# and, once the site has its own domain, the repository variable VITE_SITE_URL
# (e.g. https://alanadi.com). Without it the GitHub Pages address is used.
name: Siteyi derle ve yayınla

on:
  # Nightly builds give new artworks their own page; they matter for search
  # engines, so they are switched on once the site has its own domain.
  # schedule:
  #   - cron: '0 3 * * *' # every day 03:00 UTC (06:00 Türkiye)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build (with static pages from Firestore)
        run: npm run build
        env:
          CI: true
          VITE_SITE_URL: ${{ vars.VITE_SITE_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_EMAILJS_SERVICE_ID: ${{ secrets.VITE_EMAILJS_SERVICE_ID }}
          VITE_EMAILJS_PUBLIC_KEY: ${{ secrets.VITE_EMAILJS_PUBLIC_KEY }}
          VITE_EMAILJS_TEMPLATE_ID: ${{ secrets.VITE_EMAILJS_TEMPLATE_ID }}
          VITE_IMGBB_API_KEY: ${{ secrets.VITE_IMGBB_API_KEY }}

      - name: Publish to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
