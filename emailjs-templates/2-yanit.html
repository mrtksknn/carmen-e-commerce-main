<!--
  EmailJS şablonu: YANIT  →  admin panelinden müşteriye gider
  Şablon kimliği (.env):  VITE_EMAILJS_REPLY_TEMPLATE_ID   (şu an: template_3js4x5t)

  EmailJS panelinde:
    Subject   :  Piece Of Oblivion · {{artwork_name}}
    To Email  :  {{customer_email}}
    From Name :  Beliz Keskin · Piece Of Oblivion
    Reply To  :  (boş bırakın ya da stüdyonun e-posta adresini yazın)
  Content alanında "Code" (</>) görünümüne geçip aşağıdaki <table> bloğunun
  TAMAMINI yapıştırın.

  Panel şu değişkenleri gönderir:
    customer_email, customer_name, artwork_name, original_message, reply_message
  Not: {{artwork_name}} iletişim formundan gelen taleplerde boştur; konu
  satırı o durumda "Piece Of Oblivion · " olarak kalır.
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f6f2ec;padding:32px 16px;font-family:Georgia,'Times New Roman',serif;color:#16120f;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#ffffff;border:1px solid #e4dcd1;">
        <tr>
          <td style="padding:28px 32px 8px;">
            <p style="margin:0;font-family:Arial,Helvetica,sans-serif;font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#6f665d;">Piece Of Oblivion</p>
            <div style="width:40px;height:2px;background:#af362c;margin:16px 0 0;"></div>
          </td>
        </tr>
        <tr>
          <td style="padding:20px 32px 8px;">
            <p style="margin:0 0 18px;font-size:17px;">{{customer_name}},</p>
            <p style="margin:0;font-size:16px;line-height:1.65;white-space:pre-line;">{{reply_message}}</p>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 32px 28px;">
            <p style="margin:0;font-size:16px;font-style:italic;">Beliz Keskin</p>
            <p style="margin:4px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#6f665d;">Piece Of Oblivion</p>
          </td>
        </tr>
        <tr>
          <td style="padding:16px 32px 24px;border-top:1px solid #e4dcd1;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.5;color:#6f665d;">
            <p style="margin:0 0 6px;text-transform:uppercase;letter-spacing:2px;font-size:10px;">Mesajınız / Your message</p>
            <p style="margin:0;white-space:pre-line;">{{original_message}}</p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
