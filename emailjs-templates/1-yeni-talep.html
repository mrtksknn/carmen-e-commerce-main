<!--
  EmailJS şablonu: YENİ TALEP  →  stüdyoya gelir
  Şablon kimliği (.env):  VITE_EMAILJS_TEMPLATE_ID

  EmailJS panelinde:
    Subject   :  Yeni talep · {{subject}}
    To Email  :  (stüdyonun e-posta adresi, SABİT yazın; {{to_email}} KULLANMAYIN)
    From Name :  Piece Of Oblivion
    Reply To  :  {{reply_to}}
  Content alanında "Code" (</>) görünümüne geçip bu dosyanın aşağıdaki
  <table> bloğunun TAMAMINI yapıştırın.

  Logo, sitenin kendisinden yüklenir:
    https://mrtksknn.github.io/carmen-e-commerce-main/email-logo.png
  (Site yayına alındığında public/email-logo.png bu adreste olur. Alan adı
  değişirse bu adresi de güncelleyin.)

  Değişkenler çift süslü parantezle ({{...}}) yazıldı; EmailJS bunları HTML
  olarak kaçışlar, yani formdan gelen metin e-postada kod olarak çalışamaz.
  Üçlü parantez ({{{...}}}) KULLANMAYIN.

  Site şu değişkenleri gönderir:
    from_name, from_email, reply_to, subject,
    interest, location, artworks, message
-->
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" bgcolor="#030303" style="background-color:#030303;padding:40px 16px;font-family:'Cormorant Garamond',Georgia,'Times New Roman',serif;color:#ece6df;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:580px;">

        <!-- Logo -->
        <tr>
          <td align="left" style="padding:0 4px 28px;">
            <img src="https://mrtksknn.github.io/carmen-e-commerce-main/email-logo.png" width="226" height="56" alt="Piece Of Oblivion" style="display:block;width:226px;height:56px;border:0;outline:none;text-decoration:none;color:#f26868;font-size:20px;" />
          </td>
        </tr>

        <!-- Card -->
        <tr>
          <td bgcolor="#0a0a0a" style="background-color:#0a0a0a;border:1px solid #1f1d1c;border-radius:3px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
              <tr>
                <td style="padding:36px 36px 8px;">
                  <h1 style="margin:0;font-size:30px;font-weight:300;line-height:1.2;color:#ffffff;">{{subject}}</h1>
                  <div style="width:48px;height:1px;background-color:#f26868;margin:22px 0 0;line-height:1px;font-size:1px;">&nbsp;</div>
                </td>
              </tr>

              <tr>
                <td style="padding:22px 36px 6px;">
                  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="font-family:Arial,Helvetica,sans-serif;font-size:14px;line-height:1.5;">
                    <tr>
                      <td valign="top" style="padding:9px 0;width:112px;color:#9c948c;font-size:11px;letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid #1a1918;">Gönderen</td>
                      <td valign="top" style="padding:9px 0;color:#ece6df;border-bottom:1px solid #1a1918;">{{from_name}}</td>
                    </tr>
                    <tr>
                      <td valign="top" style="padding:9px 0;color:#9c948c;font-size:11px;letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid #1a1918;">E-posta</td>
                      <td valign="top" style="padding:9px 0;border-bottom:1px solid #1a1918;"><a href="mailto:{{from_email}}" style="color:#f26868;text-decoration:none;">{{from_email}}</a></td>
                    </tr>
                    <tr>
                      <td valign="top" style="padding:9px 0;color:#9c948c;font-size:11px;letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid #1a1918;">Konu</td>
                      <td valign="top" style="padding:9px 0;color:#ece6df;border-bottom:1px solid #1a1918;">{{interest}}</td>
                    </tr>
                    <tr>
                      <td valign="top" style="padding:9px 0;color:#9c948c;font-size:11px;letter-spacing:2px;text-transform:uppercase;border-bottom:1px solid #1a1918;">Eser(ler)</td>
                      <td valign="top" style="padding:9px 0;color:#ece6df;border-bottom:1px solid #1a1918;">{{artworks}}</td>
                    </tr>
                    <tr>
                      <td valign="top" style="padding:9px 0;color:#9c948c;font-size:11px;letter-spacing:2px;text-transform:uppercase;">Konum</td>
                      <td valign="top" style="padding:9px 0;color:#ece6df;">{{location}}</td>
                    </tr>
                  </table>
                </td>
              </tr>

              <tr>
                <td style="padding:22px 36px 34px;">
                  <p style="margin:0 0 10px;font-family:Arial,Helvetica,sans-serif;font-size:11px;letter-spacing:2px;text-transform:uppercase;color:#9c948c;">Mesaj</p>
                  <p style="margin:0;font-size:18px;line-height:1.6;color:#ffffff;white-space:pre-line;">{{message}}</p>
                </td>
              </tr>

              <tr>
                <td style="padding:0 36px 34px;">
                  <a href="mailto:{{reply_to}}" style="display:inline-block;padding:13px 26px;background-color:#ffffff;color:#030303;border-radius:999px;font-family:Arial,Helvetica,sans-serif;font-size:11px;font-weight:bold;letter-spacing:2px;text-transform:uppercase;text-decoration:none;">Yanıtla</a>
                </td>
              </tr>
            </table>
          </td>
        </tr>

        <!-- Footer -->
        <tr>
          <td style="padding:22px 4px 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:1.6;color:#948c84;">
            Bu e-postayı yanıtladığınızda cevap doğrudan gönderene gider. Talep, admin panelindeki "Talepler" sekmesinde de kayıtlıdır.
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
